# Cloudflare Worker for the Field Guide "Suggest a place" form. Deploy from this folder with
# `npx wrangler deploy` (see README.md). It answers one path on placemoir.app; GitHub Pages
# keeps serving everything else.
name = "placemoir-place-suggestions"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "placemoir.app/api/field-guide-suggestions", zone_name = "placemoir.app" },
]

[vars]
# The private repo that receives the suggestions. The token must reach this repo only.
GITHUB_REPO = "TweetingBirds/placemoir-suggestions"
ALLOWED_ORIGIN = "https://placemoir.app"
TURNSTILE_HOSTNAME = "placemoir.app"

# Rate limits, counted at each Cloudflare location. `period` must be 10 or 60 seconds.
# One person: 3 suggestions a minute.
[[ratelimits]]
name = "PER_IP"
namespace_id = "2701"
simple = { limit = 3, period = 60 }

# Everyone together: 20 a minute, a ceiling in case the form is ever flooded.
[[ratelimits]]
name = "EVERYONE"
namespace_id = "2702"
simple = { limit = 20, period = 60 }

# Secrets, set once with `npx wrangler secret put <NAME>` and never committed:
#   GITHUB_TOKEN      fine-grained token: Issues read and write, on GITHUB_REPO only
#   TURNSTILE_SECRET  the Turnstile widget's secret key
